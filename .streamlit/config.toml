[theme]
# ぱいん成績管理: 「平らなキー」(温かいベージュ × フラットな白いキー × こげ茶) のライトテーマ
# メインアプリ・入力アプリ共通。どちらのアプリも、部品の色は CSS でも固定している。

base = "light"

# 背景 (アプリ全体)
backgroundColor = "#e9e4e2"

# ウィジェット(セレクトボックス・入力欄・表)の背景
secondaryBackgroundColor = "#f8f6f5"

# 文字色
textColor = "#2b2422"

# アクセントカラー (こげ茶)
primaryColor = "#6e5236"

font = "sans serif"

[server]
# アップロード上限など必要に応じて
maxUploadSize = 50
